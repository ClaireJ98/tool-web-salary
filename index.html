<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahi / Fano 薪资计算</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb; --panel: #fff; --text: #1f2937; --muted: #6b7280;
      --primary: #2563eb; --primary-soft: #dbeafe; --success: #059669;
      --success-soft: #d1fae5; --danger: #dc2626; --danger-soft: #fee2e2;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; background: #111827; color: #fff; flex-wrap: wrap; gap: 8px;
    }
    .topbar a, .topbar button.link {
      color: #dbeafe; margin-left: 16px; text-decoration: none;
      background: none; border: 0; cursor: pointer; font: inherit; padding: 0;
    }
    .topbar button.link.active { color: #fff; font-weight: 700; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px 40px; }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    h3 { margin: 16px 0 8px; font-size: 1rem; }
    .subtitle { color: var(--muted); margin: 0 0 16px; }
    .actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 10px 18px; border-radius: 8px; border: none;
      text-decoration: none; cursor: pointer; font-size: .95rem; background: #e5e7eb; color: var(--text);
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: left; }
    th { background: #f9fafb; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
    .alert { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
    .alert-error { background: var(--danger-soft); color: var(--danger); }
    .alert-success { background: var(--success-soft); color: var(--success); }
    .back { color: var(--primary); text-decoration: none; display: inline-block; margin-bottom: 8px; background: none; border: 0; cursor: pointer; font: inherit; }
    .tips-box { margin-top: 16px; padding: 12px 14px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; font-size: .9rem; line-height: 1.7; }
    .error-list { margin: 8px 0 0; padding-left: 20px; color: #b91c1c; font-size: .9rem; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hidden { display: none !important; }
    .checkbox { display: flex; align-items: center; gap: 8px; }
    .file-dropzone {
      position: relative; border: 2px dashed var(--border); border-radius: 10px;
      background: #fff; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .file-dropzone:hover { border-color: #94a3b8; background: #f8fafc; }
    .file-dropzone.is-dragover { border-color: var(--primary); background: var(--primary-soft); }
    .file-dropzone-input { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .file-dropzone-inner { padding: 18px 14px; text-align: center; }
    .file-dropzone-hint { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .file-dropzone-name { margin: 8px 0 0; font-size: .85rem; color: var(--primary); font-weight: 600; word-break: break-all; }
    .public-products { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
    .public-card {
      display: flex; flex-direction: column; gap: 8px; padding: 22px 20px;
      border-radius: 12px; text-decoration: none; border: 1px solid var(--border); cursor: pointer; background: #fff;
    }
    .public-card strong { font-size: 1.25rem; }
    .public-card span { color: var(--muted); font-size: .95rem; }
    .sahi-card { background: #f0fdfa; color: #134e4a; border-color: #99f6e4; }
    .fano-card { background: #f5f3ff; color: #4c1d95; border-color: #ddd6fe; }
    .sahi-app { --primary: #0f766e; --primary-soft: #ccfbf1; --bg: #f0fdfa; }
    .sahi-app .sahi-topbar { background: #134e4a; }
    .sahi-app .sahi-topbar a, .sahi-app .sahi-topbar button.link { color: #99f6e4; }
    .sahi-app .btn-primary { background: #0f766e; }
    .sahi-app .btn-secondary { color: #0f766e; border-color: #0f766e; }
    .sahi-app .back { color: #0f766e; }
    .fano-app { --primary: #6d28d9; --primary-soft: #ede9fe; --bg: #f5f3ff; }
    .fano-app .sahi-topbar { background: #4c1d95; }
    .fano-app .sahi-topbar a, .fano-app .sahi-topbar button.link { color: #ddd6fe; }
    .fano-app .btn-primary { background: #6d28d9; }
    .fano-app .btn-secondary { color: #6d28d9; border-color: #6d28d9; }
    .fano-app .back { color: #6d28d9; }
    body.sahi-app, body.fano-app { background: var(--bg); }
    .calc-form select, .calc-form input:not([type="checkbox"]):not([type="file"]) {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    }
    .muted { color: var(--muted); }
    .num { white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar sahi-topbar" id="topbar">
    <div class="brand" id="brand">区域薪资计算</div>
    <nav id="nav" class="hidden">
      <button class="link" data-go="calc">计算薪资</button>
      <button class="link" data-go="policy">分区政策</button>
      <button class="link" data-go="guilds">公会档案</button>
      <button class="link" data-go="home">切换产品</button>
    </nav>
  </header>
  <main class="container" id="app"></main>
  <script>
(function () {
  "use strict";

  const PAYOUT_HEADERS = [
    "UID (必填)",
    "红钻数量 (必填,发放为正整数)",
    "发放原因 (必填, 0:其他; 1:红钻薪资; 2:红钻奖励; 3:活动奖励; 4:测试红钻)",
    "操作描述 (选填)",
    "备注 (选填)",
  ];

  const TURKEY_TIERS = [
    [1,40000,28000,21000],[2,110000,66000,54000],[3,220000,130000,100000],[4,360000,210000,170000],
    [5,500000,300000,240000],[6,660000,440000,350000],[7,880000,530000,430000],[8,1100000,660000,540000],
    [9,1460000,880000,720000],[10,2640000,1700000,1400000],[11,3300000,2000000,1600000],[12,4400000,2600000,2100000],
    [13,5860000,3900000,3100000],[14,6900000,4100000,3400000],[15,8000000,4800000,3900000],[16,11000000,6600000,5400000],
    [17,14000000,8500000,6900000],[18,18000000,12000000,9700000],[19,25000000,15000000,12000000],[20,30000000,18000000,14000000],
    [21,36000000,21000000,17000000],[22,42000000,25000000,20000000],[23,51000000,30000000,25000000],[24,57000000,34000000,28000000],
    [25,66000000,44000000,35000000],[26,76000000,51000000,37000000],[27,88000000,53000000,43000000],[28,110000000,66000000,54000000],
    [29,145000000,88000000,71000000],[30,180000000,100000000,89000000],[31,220000000,140000000,110000000],
  ];
  const STANDARD_TIERS = [
    [1,30000,114000,30000],[2,45000,171000,45000],[3,60000,228000,60000],[4,75000,285000,75000],
    [5,90000,342000,90000],[6,120000,456000,120000],[7,150000,570000,150000],[8,180000,684000,180000],
    [9,210000,798000,210000],[10,300000,1140000,300000],[11,450000,1710000,450000],[12,600000,2280000,600000],
    [13,900000,3420000,900000],[14,1200000,4560000,1200000],[15,1500000,5700000,1500000],[16,3000000,11400000,3000000],
    [17,6000000,22800000,6000000],[18,10000000,38000000,10000000],
  ];
  const AFRICA_TARGETS = [900000,1350000,1800000,2250000,2700000,3600000,4500000,5400000,6300000,9000000,13500000,18000000,27000000,36000000,45000000,90000000,180000000,300000000];
  const AFRICA_TIERS = AFRICA_TARGETS.map((t, i) => [i + 1, t, Math.trunc(t * 16 / 10), Math.trunc(t * 8 / 10)]);
  const FANO_TR_TARGETS = [900000,1350000,1800000,2250000,2700000,3600000,4500000,5400000,6300000,9000000,13500000,18000000,27000000,36000000,45000000,90000000,180000000,300000000,420000000,540000000,700000000,840000000,1000000000,1200000000,1400000000,1600000000,1800000000,2000000000];
  const FANO_TURKEY_TIERS = FANO_TR_TARGETS.map((t, i) => [i + 1, t, Math.trunc(t * 18 / 10), t]);
  const SPECIAL_5241_QUOTAS = [
    100000,200000,300000,400000,500000,600000,700000,800000,900000,1000000,
    1200000,1400000,1600000,1800000,2000000,2300000,2600000,2900000,3200000,3500000,
    4000000,4500000,5000000,5500000,6000000,7000000,8000000,9000000,10000000,11000000,12000000,13000000,14000000,15000000,
    16500000,18000000,19500000,21000000,23000000,25000000,27500000,30000000,
    32000000,34000000,36000000,38000000,40000000,42000000,44000000,46000000,50000000,
    55000000,60000000,65000000,70000000,75000000,80000000,85000000,90000000,
    100000000,110000000,120000000,130000000,140000000,150000000,
    170000000,190000000,210000000,230000000,250000000,270000000,290000000,
    320000000,350000000,380000000,410000000,440000000,470000000,500000000,
    540000000,580000000,620000000,660000000,700000000,750000000,800000000,850000000,900000000,950000000,1000000000,
    1060000000,1120000000,1180000000,1250000000,1320000000,1390000000,1460000000,1550000000,
  ];
  const SPECIAL_5241_TIERS = SPECIAL_5241_QUOTAS.map((q, i) => [i + 1, q, Math.trunc(q * 4 / 100), Math.trunc(q * 1 / 100)]);

  function tuplesToTiers(rows) {
    return rows.map(([tier_no, revenue_min, streamer_bonus, leader_bonus]) => ({
      tier_no, revenue_min, streamer_bonus, leader_bonus,
    }));
  }
  function policyTiersForCode(code) {
    code = String(code || "").toUpperCase();
    if (code === "VN") return tuplesToTiers(STANDARD_TIERS);
    if (code === "TR5241" || code === "5241") return tuplesToTiers(SPECIAL_5241_TIERS);
    if (["AF", "AFRICA", "FANO_AF", "AFW", "AF_WEEK"].includes(code)) return tuplesToTiers(AFRICA_TIERS);
    if (code === "FTR" || code === "FANO_TR") return tuplesToTiers(FANO_TURKEY_TIERS);
    return tuplesToTiers(TURKEY_TIERS);
  }

  const REGIONS = [
    { code: "TR", name: "土耳其", product: "sahi", period_type: "weekly", calc_mode: "tier", special_guild_ids: "5241", region_match: "土耳其,Turkey", special_policy_code: "TR5241", bump_next_tier: 0, notes: "土耳其周结：常规 31 档。公会 5241 走 special offer（达档发下一档，主播+会长合并一张表）。" },
    { code: "CIS", name: "独联体", product: "sahi", period_type: "daily", calc_mode: "ratio", streamer_rate: 3.5, leader_rate: 0.7, room_bonus_rate: 0.25, region_match: "独联体,CIS", notes: "独联体日结：主播钻石流水 × 3.5，公会长 × 0.7，房主房间流水 × 25%。请同时上传房间流水表。" },
    { code: "VN", name: "越南", product: "sahi", period_type: "weekly", calc_mode: "tier", region_match: "越南,Vietnam", notes: "越南周结：18 档（主播 3.8 倍 / 会长 1 倍）。" },
    { code: "AF", name: "非洲日结", product: "fano", period_type: "daily", calc_mode: "tier", region_match: "非洲,Africa", notes: "Fano 非洲日结 18 档：主播 160%、公会长 80%。按 N 列「昨日红钻流水(分)」÷100。未达 1 档不发，可改用非洲周结。" },
    { code: "AFW", name: "非洲周结", product: "fano", period_type: "weekly", calc_mode: "tier", region_match: "非洲,Africa", notes: "与日结同一套 18 档。按本周红钻流水(分)÷100，本周为 0 则用上周。" },
    { code: "FTR", name: "土耳其", product: "fano", period_type: "weekly", calc_mode: "tier", region_match: "土耳其,Turkey", notes: "Fano 土耳其 28 档：主播 180%、公会长 100%。默认周结。" },
  ];
  const HIDDEN_SPECIAL = {
    code: "TR5241", name: "土耳其 5241", product: "sahi", period_type: "weekly", calc_mode: "tier",
    bump_next_tier: 1, payout_layout: "combined", notes: "98 档，达档发下一档。",
  };

  const WORK_ALIASES = {
    "主播showid": "streamer_show_id", "主播show id": "streamer_show_id", "streamer_show_id": "streamer_show_id",
    "主播uid": "streamer_uid", "streamer_uid": "streamer_uid",
    "公会id": "guild_id", "工会id": "guild_id", "guild_id": "guild_id",
    "公会长showid": "leader_show_id", "工会长showid": "leader_show_id", "leader_show_id": "leader_show_id",
    "红钻收入(流水)": "revenue", "红钻流水": "revenue", "revenue": "revenue",
    "红钻收入": "revenue_fen", "红钻收入(分)": "revenue_fen", "红钻流水(分)": "revenue_fen", "红钻流水(分)(月)": "revenue_fen",
    "今日红钻流水(分)": "today_revenue_fen", "昨日红钻流水(分)": "yesterday_revenue_fen", "昨日钻石流水(分)": "yesterday_revenue_fen",
    "今日红钻流水": "today_revenue", "昨日红钻流水": "yesterday_revenue", "昨日钻石流水": "yesterday_revenue",
    "本周红钻流水(分)": "week_revenue_fen", "本周红钻流水": "week_revenue",
    "上周红钻流水(分)": "last_week_revenue_fen", "上周红钻流水": "last_week_revenue",
    "时间(utc+8)": "work_time", "时间": "work_time",
    "在麦时长(小时)": "mic_hours", "在麦时长": "mic_hours", "工作时长": "mic_hours", "mic_hours": "mic_hours",
    "在麦天数": "mic_days", "工作天数": "mic_days", "mic_days": "mic_days",
    "主播名称": "streamer_nickname", "主播昵称": "streamer_nickname",
    "公会名称": "guild_name", "公会长昵称": "leader_nickname", "工会长昵称": "leader_nickname",
    "公会长uid": "leader_uid", "工会长uid": "leader_uid", "leader_uid": "leader_uid",
    "周期": "period", "所属大区": "region_label", "身份": "identity",
  };
  const GUILD_ALIASES = {
    "公会id": "guild_id", "工会id": "guild_id", "guild_id": "guild_id",
    "公会名称": "guild_name", "guild_name": "guild_name",
    "公会长id": "leader_show_id", "公会长showid": "leader_show_id", "工会长showid": "leader_show_id",
    "公会长昵称": "leader_nickname", "工会长昵称": "leader_nickname",
    "公会长uid": "leader_uid", "工会长uid": "leader_uid", "leader_uid": "leader_uid",
  };
  const ROOM_ALIASES = {
    "room_info.owner_id": "owner_uid", "owner_id": "owner_uid", "房主uid": "owner_uid", "房主id": "owner_uid", "owner_uid": "owner_uid",
    "房间内礼物红钻收入": "room_revenue", "房间流水": "room_revenue", "房间红钻流水": "room_revenue", "礼物红钻收入": "room_revenue",
    "room_id": "room_id", "房间id": "room_id",
  };
  const REVENUE_BLOCKLIST = ["红钻收入(余额)", "红钻收入（余额）", "待转结红钻", "待转结金币"];
  const SKIP_SHEETS = new Set(["政策", "转会待发放金币"]);
  const INT_FIELDS = new Set(["revenue","revenue_fen","today_revenue","yesterday_revenue","today_revenue_fen","yesterday_revenue_fen","week_revenue_fen","last_week_revenue_fen","week_revenue","last_week_revenue"]);
  const FLOAT_FIELDS = new Set(["mic_hours","mic_days"]);
  const REVENUE_FIELDS = new Set(["revenue","revenue_fen","today_revenue_fen","yesterday_revenue_fen","today_revenue","yesterday_revenue","week_revenue_fen","last_week_revenue_fen","week_revenue","last_week_revenue"]);

  const LS_GUILDS = "sahiFano.guilds.v1";
  const LS_POLICY = "sahiFano.policy.v1";
  const LS_SETTINGS = "sahiFano.settings.v1";

  const state = {
    product: null,
    page: "home",
    workFile: null,
    roomFile: null,
    guildFile: null,
    result: null,
  };

  function loadJson(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || "") || fallback; } catch { return fallback; }
  }
  function saveJson(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

  function cloneRegion(base) {
    const settings = loadJson(LS_SETTINGS, {});
    const ov = settings[base.product + ":" + base.code] || {};
    return Object.assign({
      streamer_rate: 3.5, leader_rate: 0.7, room_bonus_rate: 0.25,
      special_guild_ids: "", region_match: "", special_policy_code: "", bump_next_tier: 0,
    }, base, ov);
  }
  function regionsFor(product) {
    return REGIONS.filter((r) => r.product === product).map(cloneRegion);
  }
  function getRegion(product, code) {
    const found = REGIONS.find((r) => r.product === product && r.code === code);
    return found ? cloneRegion(found) : null;
  }
  function tiersFor(region) {
    const saved = loadJson(LS_POLICY, {});
    const key = region.product + ":" + region.code;
    if (saved[key] && saved[key].length) return saved[key];
    return policyTiersForCode(region.code);
  }
  function guildMapFor(product, code) {
    return loadJson(LS_GUILDS, {})[product + ":" + code] || {};
  }

  function rateBonus(revenue, rate) {
    revenue = Number(revenue || 0);
    if (revenue <= 0 || rate <= 0) return 0;
    return Math.trunc(revenue * rate);
  }
  function fenToDiamonds(fen) { return Math.trunc(Number(fen || 0) / 100); }
  function ratioResult(revenue, streamerRate, leaderRate) {
    return { tier_no: null, revenue_min: null, streamer_bonus: rateBonus(revenue, streamerRate), leader_bonus: rateBonus(revenue, leaderRate), payout_tier_no: null };
  }
  function matchTier(revenue, tiers, bumpNext) {
    revenue = Number(revenue || 0);
    let best = null;
    for (const tier of tiers) {
      const req = Number(tier.revenue_min);
      if (revenue >= req && (!best || req > Number(best.revenue_min))) best = tier;
    }
    if (!best) return { tier_no: null, revenue_min: null, streamer_bonus: 0, leader_bonus: 0, payout_tier_no: null };
    let payout = best;
    if (bumpNext) {
      const higher = tiers.filter((t) => Number(t.revenue_min) > Number(best.revenue_min));
      if (higher.length) payout = higher.reduce((a, b) => Number(a.revenue_min) < Number(b.revenue_min) ? a : b);
    }
    return {
      tier_no: Number(best.tier_no), revenue_min: Number(best.revenue_min),
      streamer_bonus: Number(payout.streamer_bonus), leader_bonus: Number(payout.leader_bonus),
      payout_tier_no: Number(payout.tier_no),
    };
  }
  function parseIdList(raw) {
    return String(raw || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  }
  function shouldSkipWorkRow(row, specialIds, keywords) {
    const guildId = String(row.guild_id || "").trim();
    const regionLabel = String(row.region_label || "").trim();
    const special = new Set(specialIds);
    if (guildId && special.has(guildId)) return "special_guild";
    if (regionLabel === "无工会信息" || regionLabel === "无公会信息") return "no_guild";
    if (keywords.length && regionLabel && regionLabel !== "已退会") {
      if (!keywords.some((k) => regionLabel.includes(k))) return "other_region";
    }
    return null;
  }
  function pickWorkRevenue(row, daily) {
    if (daily) {
      if (Object.prototype.hasOwnProperty.call(row, "yesterday_revenue_fen") && row.yesterday_revenue_fen != null)
        return fenToDiamonds(row.yesterday_revenue_fen);
      if (Object.prototype.hasOwnProperty.call(row, "yesterday_revenue") && row.yesterday_revenue != null)
        return Number(row.yesterday_revenue || 0);
      if (Object.prototype.hasOwnProperty.call(row, "revenue_fen") && row.revenue_fen != null)
        return fenToDiamonds(row.revenue_fen);
      return 0;
    }
    let week = null, lastWeek = null;
    if (Object.prototype.hasOwnProperty.call(row, "week_revenue_fen") && row.week_revenue_fen != null)
      week = fenToDiamonds(row.week_revenue_fen);
    else if (Object.prototype.hasOwnProperty.call(row, "week_revenue") && row.week_revenue != null)
      week = Number(row.week_revenue || 0);

  function aggregateLeaderPayouts(rows) {

  function enrichAndCalculate(region, workRows, guildMap) {
    const tiers = tiersFor(region);
    const specialIds = parseIdList(region.special_guild_ids);
    const keywords = parseIdList(region.region_match);
    const bumpRegular = !!Number(region.bump_next_tier || 0);
    const specialTiers = region.special_policy_code ? policyTiersForCode(region.special_policy_code) : [];
    const specialBump = !!region.special_policy_code;
    const ratioMode = String(region.calc_mode || "tier").toLowerCase() === "ratio";
    const daily = String(region.period_type || "weekly") === "daily";
    const streamerRate = Number(region.streamer_rate == null || region.streamer_rate === "" ? 3.5 : region.streamer_rate);
    const leaderRate = Number(region.leader_rate == null || region.leader_rate === "" ? 0.7 : region.leader_rate);
    const warnings = [];
    const results = [];
    let skippedOther = 0;

    function fillLeader(row) {
      const guildId = String(row.guild_id || "").trim();
      const guild = guildMap[guildId];
      return {
        guild_id: guildId,
        leader_uid: String(row.leader_uid || (guild && guild.leader_uid) || "").trim(),
        leader_show_id: String(row.leader_show_id || (guild && guild.leader_show_id) || "").trim(),
        leader_nickname: String(row.leader_nickname || (guild && guild.leader_nickname) || "").trim(),
        guild_name: String(row.guild_name || (guild && guild.guild_name) || "").trim(),
      };
    }
    function calculatedRow(row, filled, matched, recordKind) {
      return {
        streamer_show_id: String(row.streamer_show_id || ""),
        streamer_uid: String(row.streamer_uid || ""),
        streamer_nickname: String(row.streamer_nickname || ""),
        guild_id: filled.guild_id,
        leader_show_id: filled.leader_show_id,
        leader_uid: filled.leader_uid,
        leader_nickname: filled.leader_nickname,
        guild_name: filled.guild_name,
        revenue: Number(row.revenue || 0),
        mic_hours: row.mic_hours,
        mic_days: row.mic_days,
        tier_no: matched.tier_no,
        payout_tier_no: matched.payout_tier_no,
        streamer_bonus: matched.streamer_bonus,
        leader_bonus: matched.leader_bonus,
        region_label: String(row.region_label || ""),
        identity: String(row.identity || ""),
        record_kind: recordKind,
      };
    }

    for (const raw of workRows) {
      const workRow = Object.assign({}, raw);
      workRow.revenue = pickWorkRevenue(workRow, daily);
      const reason = shouldSkipWorkRow(workRow, specialIds, keywords);
      if (reason === "special_guild") {
        const filled = fillLeader(workRow);
        if (filled.guild_id && !filled.leader_uid) {
          warnings.push(`公会 ${filled.guild_id} 未在公会档案中找到，主播 ${workRow.streamer_uid} 缺少会长 UID`);
        }
        const matched = matchTier(Number(workRow.revenue || 0), specialTiers.length ? specialTiers : tiers, specialBump);
        results.push(calculatedRow(workRow, filled, matched, "special"));
        continue;
      }
      if (reason) { skippedOther += 1; continue; }
      const filled = fillLeader(workRow);
      if (filled.guild_id && !filled.leader_uid) {
        warnings.push(`公会 ${filled.guild_id} 未在公会档案中找到，主播 ${workRow.streamer_uid} 缺少会长 UID`);
      }
      if (!filled.leader_uid) {
        warnings.push(`主播 ${workRow.streamer_uid}（公会 ${filled.guild_id || "-"}）缺少公会长 UID`);
      }
      const matched = ratioMode
        ? ratioResult(Number(workRow.revenue || 0), streamerRate, leaderRate)
        : matchTier(Number(workRow.revenue || 0), tiers, bumpRegular);
      results.push(calculatedRow(workRow, filled, matched, "regular"));
    }
    return {
      records: results,
      warnings: [...new Set(warnings)],
      skippedOther,
      calc_mode: ratioMode ? "ratio" : "tier",
      daily,
      streamer_rate: streamerRate,
      leader_rate: leaderRate,
      room_bonus_rate: Number(region.room_bonus_rate == null || region.room_bonus_rate === "" ? 0.25 : region.room_bonus_rate),

  }

    const headers = rowsAll[0], data = rowsAll.slice(1);

    if (!fields.has("guild_id")) return { rows: [], errors: ["缺少必填列：公会 id"] };

  async function parseRoomBonusFile(file, rate) {
    rate = rate == null ? 0.25 : rate;
    const wb = await readWorkbook(file);
    const rowsAll = sheetRows(wb.Sheets[wb.SheetNames[0]]);
    if (!rowsAll.length) return { rows: [], errors: ["空表"] };
    const headers = rowsAll[0], data = rowsAll.slice(1);
    const colmap = mapHeaders(headers, ROOM_ALIASES);
    const fields = new Set(Object.values(colmap));
    if (!fields.has("owner_uid")) return { rows: [], errors: ["缺少必填列：房主 UID（room_info.owner_id）"] };
    if (!fields.has("room_revenue")) return { rows: [], errors: ["缺少必填列：房间内礼物红钻收入"] };
    const parsed = [], errors = [], seen = new Set();
    data.forEach((raw, idx) => {
      if (isEmptyRow(raw)) return;
      const first = cellStr(raw[0]);
      if (first.startsWith("阶段汇总")) return;
      const item = {};
      for (const [colI, field] of Object.entries(colmap)) {
        const val = raw[Number(colI)];
        item[field] = field === "room_revenue" ? cellInt(val) : cellStr(val);

      const uid = String(item.owner_uid || "").trim();
      if (!uid || uid === "0" || uid === "0.0" || uid === "-") {
        errors.push(`第 ${idx + 2} 行：房主 UID 为空，已跳过`);
        return;
      }
      const pairKey = uid + "\t" + Number(item.room_revenue || 0);
      if (seen.has(pairKey)) return;
      seen.add(pairKey);
      parsed.push([uid, Number(item.room_revenue || 0)]);
    });
    const totals = {};
    for (const [uid, rev] of parsed) totals[uid] = (totals[uid] || 0) + rev;
    const rows = Object.entries(totals).map(([owner_uid, room_revenue]) => ({
      owner_uid, room_revenue, room_bonus: rateBonus(room_revenue, rate),
    })).sort((a, b) => b.room_bonus - a.room_bonus || a.owner_uid.localeCompare(b.owner_uid));

  }

      const wrapper = document.createElement("div");
      wrapper.className = "file-dropzone";
      wrapper.innerHTML = '<div class="file-dropzone-inner"><p class="file-dropzone-hint">拖拽文件到此处，或点击选择</p><p class="file-dropzone-name"></p></div>';
      input.classList.add("file-dropzone-input");
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);
      const nameEl = wrapper.querySelector(".file-dropzone-name");
      wrapper.addEventListener("click", (e) => { e.preventDefault(); input.click(); });
      input.addEventListener("change", () => {
        nameEl.textContent = input.files && input.files[0] ? input.files[0].name : "";
      });
      wrapper.addEventListener("dragover", (e) => { e.preventDefault(); wrapper.classList.add("is-dragover"); });
      wrapper.addEventListener("dragleave", (e) => {
        if (!wrapper.contains(e.relatedTarget)) wrapper.classList.remove("is-dragover");
      });
      wrapper.addEventListener("drop", (e) => {
        e.preventDefault();
        wrapper.classList.remove("is-dragover");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const dt = new DataTransfer();
          dt.items.add(e.dataTransfer.files[0]);
          input.files = dt.files;
          input.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });
    });
  }

    if (product) state.product = product;

    const sel = $("#region-select");
    const region = sel ? getRegion(state.product, sel.value) : null;
    const roomField = $("#room-file-field");
    const roomInput = roomField && roomField.querySelector('input[name="room_file"]');
    const isRatio = region && region.calc_mode === "ratio";
    if (roomField) roomField.style.display = isRatio ? "" : "none";
    if (roomInput) roomInput.required = !!isRatio;
    const tips = $("#sahi-tips");
    if (tips) tips.textContent = tipsFor(region);

      const prefix = currentPrefix(r);
      const regular = r.records.filter((x) => x.record_kind !== "special");
      const special = r.records.filter((x) => x.record_kind === "special");
      if (kind === "streamer") downloadAoa(`${prefix} 主播薪资.xlsx`, payoutAoA(aggregatePayoutByUid(regular, "streamer_uid", "streamer_bonus")));
      else if (kind === "leader") downloadAoa(`${prefix} 公会长薪资.xlsx`, payoutAoA(leaderPayoutRows(regular)));

  document.addEventListener("submit", async (e) => {
    const form = e.target;
    if (form.id === "calc-form") {
      e.preventDefault();
      const alertBox = $("#calc-alert");
      const region = getRegion(state.product, form.region_code.value);
      const file = form.file.files[0];
      const roomFile = form.room_file && form.room_file.files[0];
      if (!file) return;
      if (region.calc_mode === "ratio" && !roomFile) {
        alertBox.innerHTML = `<div class="alert alert-error">独联体请同时上传房间流水表。</div>`;
        return;
      }
      alertBox.innerHTML = `<div class="alert">正在计算…</div>`;
      const parsed = await parseWorkFile(file);
      if (!parsed.rows.length) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(parsed.errors[0] || "工作表为空")}</div>`;
        return;
      }
      let room = { rows: [], errors: [] };
      if (roomFile) {
        room = await parseRoomBonusFile(roomFile, Number(region.room_bonus_rate || 0.25));
        if (room.errors.length && !room.rows.length) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(room.errors[0])}</div>`;
          return;
        }
      }
      const extra = enrichAndCalculate(region, parsed.rows, guildMapFor(state.product, region.code));
      const weekLabel = String(form.week_label.value || "").trim() || inferWeekLabel(parsed.rows, extra.daily) || new Date().toISOString().slice(0, 10).replace(/-/g, "");
      state.result = Object.assign(extra, {
        region_name: region.name,
        region_code: region.code,
        week_label: weekLabel,
        room_records: room.rows,
        parse_errors: parsed.errors.concat(room.errors || []),
      });
      if (state.result.parse_errors.length) {
        state.result.warnings = state.result.parse_errors.concat(state.result.warnings);
      }
      go("result", state.product);
      return;
    }
    if (form.id === "settings-form") {
      e.preventDefault();
      const code = $("#policy-region").value;
      const fd = new FormData(form);
      const settings = loadJson(LS_SETTINGS, {});
      settings[state.product + ":" + code] = {
        name: fd.get("name"),
        period_type: fd.get("period_type"),
        calc_mode: fd.get("calc_mode"),
        streamer_rate: fd.get("streamer_rate"),
        leader_rate: fd.get("leader_rate"),
        room_bonus_rate: fd.get("room_bonus_rate"),
        special_guild_ids: fd.get("special_guild_ids"),
        region_match: fd.get("region_match"),
        special_policy_code: fd.get("special_policy_code"),
        bump_next_tier: form.bump_next_tier.checked ? 1 : 0,
      };
      saveJson(LS_SETTINGS, settings);
      render();
      const panel = $(".panel");
      panel.insertAdjacentHTML("afterbegin", `<div class="alert alert-success">政策已更新</div>`);
      return;
    }
    if (form.id === "guild-form") {
      e.preventDefault();
      const code = $("#guild-region").value;
      const file = form.guild_file.files[0];
      const parsed = await parseGuildFile(file);
      const box = $("#guild-alert");
      if (!parsed.rows.length) {
        box.innerHTML = `<div class="alert alert-error">${escapeHtml(parsed.errors[0] || "导入失败")}</div>`;
        return;
      }
      const all = loadJson(LS_GUILDS, {});
      const key = state.product + ":" + code;
      const map = all[key] || {};
      let inserted = 0, updated = 0;
      for (const row of parsed.rows) {
        if (map[row.guild_id]) updated += 1; else inserted += 1;
        map[row.guild_id] = row;
      }
      all[key] = map;
      saveJson(LS_GUILDS, all);
      render();
      $("#guild-alert").innerHTML = `<div class="alert alert-success">导入完成：新增 ${inserted}，更新 ${updated}</div>`;
    }
  });

  document.addEventListener("click", (e) => {
    if (e.target.id === "save-policy") {
      const code = $("#policy-region").value;
      const n = $all('input[name="revenue_min"]').length;
      const tiers = [];
      for (let i = 0; i < n; i++) {
        tiers.push({
          tier_no: i + 1,
          revenue_min: Number($(`input[name="revenue_min"][data-i="${i}"]`).value || 0),
          streamer_bonus: Number($(`input[name="streamer_bonus"][data-i="${i}"]`).value || 0),
          leader_bonus: Number($(`input[name="leader_bonus"][data-i="${i}"]`).value || 0),
        });
      }
      const saved = loadJson(LS_POLICY, {});
      saved[state.product + ":" + code] = tiers;
      saveJson(LS_POLICY, saved);
      render();
    }
    if (e.target.id === "reset-policy") {
      const code = $("#policy-region").value;
      const saved = loadJson(LS_POLICY, {});
      delete saved[state.product + ":" + code];
      saveJson(LS_POLICY, saved);
      render();
    }
  });

  function selfTest() {
    const fails = [];
    const ok = (cond, msg) => { if (!cond) fails.push(msg); };
    ok(rateBonus(10001, 3.5) === 35003, "rateBonus truncate");
    ok(rateBonus(80574, 0.25) === 20143, "room 25%");
    ok(fenToDiamonds(1234500) === 12345, "fen");
    const af = matchTier(900000, policyTiersForCode("AF"), false);
    ok(af.tier_no === 1 && af.streamer_bonus === 1440000 && af.leader_bonus === 720000, "africa t1");
    ok(matchTier(899999, policyTiersForCode("AF"), false).streamer_bonus === 0, "africa below");
    const ftr = matchTier(900000, policyTiersForCode("FTR"), false);
    ok(ftr.streamer_bonus === 1620000 && ftr.leader_bonus === 900000, "fano turkey t1");
    ok(policyTiersForCode("FTR").length === 28, "28 tiers");
    ok(policyTiersForCode("TR5241").length === 98, "98 tiers");
    const bumped = matchTier(100000, policyTiersForCode("TR5241"), true);
    ok(bumped.tier_no === 1 && bumped.payout_tier_no === 2, "5241 bump");
    ok(pickWorkRevenue({ yesterday_revenue_fen: 3600, today_revenue: 99, revenue: 1 }, true) === 36, "daily fen");
    ok(pickWorkRevenue({ week_revenue_fen: 0, week_revenue: 0, last_week_revenue_fen: 90000000, last_week_revenue: 900000 }, false) === 900000, "week fallback");
    ok(pickWorkRevenue({ revenue: 900000 }, true) === 0, "daily ignore diamond revenue");
    if (fails.length) console.error("self-test failed", fails);
    else console.log("sahi/fano self-test ok");
  }

  selfTest();
  render();
})();
  </script>
</body>
</html>
